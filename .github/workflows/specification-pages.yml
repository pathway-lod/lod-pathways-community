name: Publish the specification dashboard

# Publishes specification/index.html (and the term table it reads) with GitHub Pages
# whenever the specification changes on the main branch.
# One-time setting: Settings > Pages > Build and deployment > Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - "specification/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Without the Pages setting the deployment cannot work. Say so clearly and skip it, instead of a failing check.
      - name: Is GitHub Pages set up with the source "GitHub Actions"?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code="$(curl -s -o pages.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"
          if [ "$code" = "200" ] && grep -q '"build_type": *"workflow"' pages.json; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" = "404" ] || [ "$code" = "200" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=GitHub Pages is not set up::Settings > Pages > Build and deployment > Source must be GitHub Actions. Then re-run this workflow."
            {
              echo "### GitHub Pages is not set up"
              echo "Open **Settings > Pages > Build and deployment** and set **Source** to **GitHub Actions**, then re-run this workflow (Actions > Publish the specification dashboard > Run workflow)."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=unknown" >> "$GITHUB_OUTPUT"   # could not tell (HTTP ${code}): try the deployment anyway
          fi

      - uses: actions/checkout@v7
        if: steps.pages.outputs.enabled != 'false'

      - name: Collect the site
        if: steps.pages.outputs.enabled != 'false'
        run: |
          mkdir _site
          cp specification/index.html _site/index.html
          cp specification/ontology_terms.csv specification/SPECIFICATION.md _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v6
        if: steps.pages.outputs.enabled != 'false'

      - uses: actions/upload-pages-artifact@v5
        if: steps.pages.outputs.enabled != 'false'
        with:
          path: _site

      - id: deployment
        if: steps.pages.outputs.enabled != 'false'
        uses: actions/deploy-pages@v5
