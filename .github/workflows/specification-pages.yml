name: Publish the specification dashboard

# Publishes specification/index.html (and the term table it reads) with GitHub Pages
# whenever the specification changes on the main branch, and the evidence graph viewer (visualization_tool/)
# under /visualization_tool/ of the same site (one Pages site per repository).
# One-time setting: Settings > Pages > Build and deployment > Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - "specification/**"
      - "visualization_tool/**"
      # inputs of the viewer's data bundles (shapes, vocabulary, generated pilot RDF, sample graph)
      - "shape_constraints/**"
      - "examples/**"
      - ".github/workflows/specification-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Without the Pages setting the deployment cannot work. Say so clearly and skip it, instead of a failing check.
      - name: Is GitHub Pages set up with the source "GitHub Actions"?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code="$(curl -s -o pages.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"
          if [ "$code" = "200" ] && grep -q '"build_type": *"workflow"' pages.json; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" = "404" ] || [ "$code" = "200" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=GitHub Pages is not set up::Settings > Pages > Build and deployment > Source must be GitHub Actions. Then re-run this workflow."
            {
              echo "### GitHub Pages is not set up"
              echo "Open **Settings > Pages > Build and deployment** and set **Source** to **GitHub Actions**, then re-run this workflow (Actions > Publish the specification dashboard > Run workflow)."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=unknown" >> "$GITHUB_OUTPUT"   # could not tell (HTTP ${code}): try the deployment anyway
          fi

      - uses: actions/checkout@v7
        if: steps.pages.outputs.enabled != 'false'

      # The published page always follows the term table, even if the generated files in the repository are out of date
      # (for example after an edit of the CSV in the GitHub web editor on main).
      - name: Regenerate the dashboard and the tables from the term table
        if: steps.pages.outputs.enabled != 'false'
        working-directory: specification
        run: python3 check_terms.py --render

      - uses: actions/setup-python@v7
        if: steps.pages.outputs.enabled != 'false'
        continue-on-error: true   # viewer data only; the next step then falls back to the committed files
        with:
          python-version: "3.12"

      # Same idea for the viewer: its data (public/data/*.nq with their SHACL reports, and terms.json) follows the term table,
      # the shapes and the RDF of this commit. If the rebuild fails, the committed files are kept, so that a problem in
      # the viewer's data never stops the specification dashboard from being published.
      - name: Rebuild the viewer's data bundles and term table
        if: steps.pages.outputs.enabled != 'false'
        working-directory: visualization_tool
        run: |
          if ! { python -m pip install -r tools/requirements.txt && bash tools/rebuild_bundles.sh; }; then
            git checkout -- public/data
            echo "::warning title=Viewer data not rebuilt::tools/rebuild_bundles.sh failed; the viewer is published with the data committed in the repository."
          fi

      - uses: actions/setup-node@v7
        if: steps.pages.outputs.enabled != 'false'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: visualization_tool/package-lock.json

      # Static site in visualization_tool/dist (relative paths, so it works under /visualization_tool/).
      - name: Build the evidence graph viewer
        if: steps.pages.outputs.enabled != 'false'
        working-directory: visualization_tool
        run: npm ci && npm run build

      - name: Collect the site
        if: steps.pages.outputs.enabled != 'false'
        run: |
          mkdir _site
          cp specification/index.html _site/index.html
          cp specification/ontology_terms.csv specification/SPECIFICATION.md _site/
          cp -r visualization_tool/dist _site/visualization_tool
          touch _site/.nojekyll

      - uses: actions/configure-pages@v6
        if: steps.pages.outputs.enabled != 'false'

      - uses: actions/upload-pages-artifact@v5
        if: steps.pages.outputs.enabled != 'false'
        with:
          path: _site

      - id: deployment
        if: steps.pages.outputs.enabled != 'false'
        uses: actions/deploy-pages@v5
