name: Apply issue labels to the term table

# A maintainer puts a label on an issue; this workflow turns it into a pull request that changes
# specification/ontology_terms.csv. Only people with triage or write access can set labels, so only they can trigger it.
#   decision:agreed | decision:proposed | decision:open | decision:rejected   sets the decision of the requirement in the title
#   accept-term                                                                adds the term of a "Suggest an ontology term" issue
# One-time setting: Settings > Actions > General > Workflow permissions >
#   "Allow GitHub Actions to create and approve pull requests".
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: issue-to-csv
  cancel-in-progress: false

jobs:
  apply:
    if: startsWith(github.event.label.name, 'decision:') || github.event.label.name == 'accept-term'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the dependencies
        run: pip install requests rdflib pyyaml

      # The issue text is read by the script from the event file ($GITHUB_EVENT_PATH). It is never put in a shell command.
      - name: Apply the label to the term table
        id: apply
        working-directory: specification
        run: |
          set +e
          python apply_issue.py "$GITHUB_EVENT_PATH" | tee ../apply.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- ontology_terms.csv; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
          exit 0

      - name: Look the term up, regenerate the tables and the dashboard, and check the result
        if: steps.apply.outputs.changed == 'true'
        id: render
        working-directory: specification
        run: |
          python check_terms.py --update --render
          python check_terms.py --check-render
          python -m unittest discover -s tests

      - name: Open a pull request
        if: steps.apply.outputs.changed == 'true' && steps.render.outcome == 'success'
        run: |
          branch="bot/issue-${ISSUE}-${GITHUB_RUN_ID}"
          summary="$(head -n 1 specification/apply_issue_summary.txt)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add specification/ontology_terms.csv specification/SPECIFICATION.md specification/index.html
          git commit -m "Term table: ${summary}"
          git push origin "$branch"
          url="$(gh pr create --base "${{ github.event.repository.default_branch }}" --head "$branch" \
            --title "Term table: ${summary}" \
            --body "Records the outcome of issue #${ISSUE} in the term table and regenerates the specification and the dashboard. Review the changed rows of specification/ontology_terms.csv before merging. Refs #${ISSUE}.")"
          gh issue comment "$ISSUE" --body "A pull request records this: ${url}. Merging it updates the term table and the dashboard."

      - name: Tell the issue why nothing happened
        if: ${{ always() && (steps.apply.outputs.changed != 'true' || steps.render.outcome == 'failure') }}
        run: |
          reason="$(tail -n 3 apply.log | tr '\n' ' ')"
          if [ "${{ steps.render.outcome }}" = "failure" ]; then reason="The term could not be checked in the Ontology Lookup Service, or the generated files were inconsistent; see the workflow run."; fi
          gh issue comment "$ISSUE" --body "The label did not change the term table. ${reason}"
