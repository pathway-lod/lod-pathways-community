name: Specification checks

# Runs on every pull request and push that touches the specification, the shapes or the GitHub templates.
on:
  pull_request:
    paths:
      - "specification/**"
      - "shape_constraints/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/**"
  push:
    branches: [main, dev]
    paths:
      - "specification/**"
      - "shape_constraints/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/**"
  workflow_dispatch:

# contents: write and pull-requests: write are used only to commit regenerated files to the branch of a pull request from this
# repository (see "Regenerate"); pull requests from forks get a read-only token and are only checked.
permissions:
  contents: write
  pull-requests: write

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      # A pull request is checked out on its own branch (not the merge with main), so that regenerated files can be pushed to it.
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref || github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the dependencies
        run: pip install pyshacl==0.40.1 rdflib==7.6.0 requests pyyaml

      # SPECIFICATION.md and index.html are generated from ontology_terms.csv. When a pull request changes the term table (for example
      # in the GitHub web editor) they are regenerated here and committed to the branch, instead of failing the check below.
      # Commits made with the workflow token do not start new workflow runs, so this run is the check of the new commit.
      - name: Regenerate the generated files (pull requests from this repository)
        id: regen
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        working-directory: specification
        run: |
          python check_terms.py --update --render
          if git diff --quiet -- ontology_terms.csv SPECIFICATION.md index.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit the regenerated files to the pull request branch
        if: steps.regen.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add specification/ontology_terms.csv specification/SPECIFICATION.md specification/index.html
          git commit -m "Regenerate SPECIFICATION.md and index.html from ontology_terms.csv"
          git push
          gh pr comment "$PR_NUMBER" --body "The term table changed, so \`SPECIFICATION.md\` and \`index.html\` were regenerated from it and committed to this branch. The checks of this run were made on the regenerated files." || true

      - name: Term table is valid and the generated files are up to date
        working-directory: specification
        run: python check_terms.py --check-render

      - name: Tests of the issue script and the issue forms
        working-directory: specification
        run: python -m unittest discover -s tests -v

      - name: Tests of the shapes
        working-directory: shape_constraints
        run: python -m unittest discover -s tests -v

      - name: The sample graph conforms to the shapes
        working-directory: shape_constraints
        run: python validate.py ../examples/sample_evidence_graph.ttl --no-references
